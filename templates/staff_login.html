{% extends "base.html" %}
{% block content %}
<div class="content">
  <div class="auth-hero">
    <h1 style="font-size:22px;">Staff Login</h1>
    <p>Admin and Team Leader access</p>
  </div>
  <div class="card">
    <p style="font-weight:600;margin:0 0 10px;">Admin Panel</p>
    <form method="post">
      <input type="hidden" name="role" value="admin">
      <div class="field"><input type="password" name="password" placeholder="Enter admin password"></div>
      <button class="btn btn-primary" type="submit">Login as Admin</button>
    </form>
  </div>
  <div class="card">
    <p style="font-weight:600;margin:0 0 10px;">Team Leader Panel</p>
    <p style="font-size:13px;color:var(--ink-soft);margin:0 0 12px;">View orders, update processing/shipping status.</p>
    <form method="post">
      <input type="hidden" name="role" value="teamlead">
      <button class="btn btn-outline" type="submit">Login as Team Leader</button>
    </form>
  </div>
  <div style="text-align:center;margin-top:8px;">
    <a class="back-link" href="{{ url_for('login') }}">← Back</a>
  </div>
</div>
{% endblock %}
