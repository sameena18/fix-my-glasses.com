{% extends "base.html" %}
{% block content %}
<div class="content" style="padding-top:40px;text-align:center;">
  <div style="width:74px;height:74px;border-radius:50%;background:var(--success-soft);display:flex;align-items:center;justify-content:center;margin:10px auto 18px;font-size:34px;color:var(--success);">✓</div>
  <h2 style="margin:0 0 6px;">Payment Successful</h2>
  <p style="color:var(--ink-soft);font-size:14px;margin:0 0 20px;">Your order has been placed and is awaiting admin approval.</p>
  {% if order %}
  <div class="order-id-box">
    <small>Order ID</small>
    <div class="oid">{{ order.order_code }}</div>
  </div>
  {% include "_track_steps.html" %}
  {% endif %}
  <a class="btn btn-primary" style="margin-top:22px;" href="{{ url_for('my_orders') }}">Track my order</a>
  <div style="margin-top:12px;">
    <a class="btn-link" href="{{ url_for('home') }}">Back to home</a>
  </div>
</div>
{% endblock %}
